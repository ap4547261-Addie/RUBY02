<!-- popup.html - Enhanced with status and learning display -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 380px;
            height: 520px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Header */
        .header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #888;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: background 0.3s;
        }
        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }
        .status-dot.disconnected {
            background: #ff4444;
            box-shadow: 0 0 8px rgba(255, 68, 68, 0.4);
        }
        .status-dot.connecting {
            background: #ffaa00;
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* Stats Bar */
        .stats-bar {
            padding: 6px 16px;
            background: #141425;
            border-bottom: 1px solid #1a1a30;
            display: flex;
            gap: 16px;
            font-size: 10px;
            color: #666;
            flex-shrink: 0;
        }
        .stats-bar span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stats-bar .value {
            color: #00d4ff;
            font-weight: 600;
        }
        
        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            background: #0d0d1a;
            scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar {
            width: 4px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 2px;
        }
        
        .message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 90%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            background: #1a1a3e;
            align-self: flex-end;
            margin-left: auto;
            border: 1px solid #2a2a5e;
        }
        .message.user .sender {
            color: #ffeb3b;
        }
        .message.ruby {
            background: #1a2a2a;
            align-self: flex-start;
            border: 1px solid #1a3a3a;
        }
        .message.ruby .sender {
            color: #00d4ff;
        }
        .message.system {
            background: #1a1a1a;
            align-self: center;
            max-width: 100%;
            font-size: 11px;
            color: #666;
            text-align: center;
            border: 1px dashed #2a2a2a;
        }
        .message .sender {
            font-size: 11px;
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }
        .message .text {
            font-size: 13px;
            line-height: 1.5;
        }
        .message .timestamp {
            font-size: 9px;
            color: #444;
            margin-top: 4px;
            display: block;
        }
        
        /* Learning Indicator */
        .learning-indicator {
            padding: 4px 12px;
            background: #0a1a0a;
            border-top: 1px solid #1a2a1a;
            font-size: 10px;
            color: #00aa66;
            text-align: center;
            flex-shrink: 0;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .learning-indicator.active {
            background: #0a1a0a;
            color: #00ff88;
        }
        .learning-indicator .spinner {
            display: none;
            width: 12px;
            height: 12px;
            border: 2px solid #1a3a1a;
            border-top: 2px solid #00ff88;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .learning-indicator.active .spinner {
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Input Area */
        .input-area {
            padding: 8px 12px;
            background: #141425;
            border-top: 1px solid #1a1a30;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 8px 12px;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-area input:focus {
            border-color: #00d4ff;
        }
        .input-area input::placeholder {
            color: #555;
        }
        .input-area button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #00d4ff, #0088cc);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }
        .input-area button:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        .input-area button:active {
            transform: scale(0.98);
        }
        
        /* Quick Actions */
        .quick-actions {
            padding: 4px 12px 8px;
            background: #0d0d1a;
            border-top: 1px solid #1a1a30;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .quick-actions button {
            padding: 3px 10px;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            color: #888;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-actions button:hover {
            background: #2a2a4a;
            color: #fff;
            border-color: #00d4ff;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #444;
        }
        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .empty-state h3 {
            color: #666;
            font-weight: 400;
            font-size: 14px;
        }
        .empty-state p {
            font-size: 12px;
            color: #333;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>🧠 Ruby Bridge</h1>
        <div class="status-indicator">
            <span class="status-dot connecting" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </div>
    
    <!-- Stats Bar -->
    <div class="stats-bar">
        <span>📊 Learned: <span class="value" id="learnedCount">0</span></span>
        <span>💾 Memory: <span class="value" id="memoryCount">0</span></span>
        <span>🔌 Queue: <span class="value" id="queueCount">0</span></span>
    </div>
    
    <!-- Chat Container -->
    <div class="chat-container" id="chat-container">
        <div class="empty-state" id="emptyState">
            <div class="icon">💬</div>
            <h3>Chat with Ruby</h3>
            <p>Ask questions or send content to learn</p>
        </div>
    </div>
    
    <!-- Learning Indicator -->
    <div class="learning-indicator" id="learningIndicator">
        <span class="spinner" id="spinner"></span>
        <span id="learningText">📡 Ready to learn</span>
    </div>
    
    <!-- Quick Actions -->
    <div class="quick-actions">
        <button data-action="learnPage">📄 Learn Page</button>
        <button data-action="search">🔍 Search</button>
        <button data-action="status">📊 Status</button>
        <button data-action="clear">🗑️ Clear</button>
    </div>
    
    <!-- Input Area -->
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask Ruby or enter a topic...">
        <button id="send-btn">Send</button>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>

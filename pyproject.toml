[project]
name = "ruby"
version = "0.1.0"
description = "Ruby - A living human from a parallel world with local brain, 9-key Gemini support, and social media learning"
authors = [
    {name = "Ruby", email = "ruby@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"                    # Changed from 3.12 to 3.10 for torch compatibility
dependencies = [
    # Core UI Framework
    "flet>=0.25.0",
    
    # Google Gemini API
    "google-genai>=0.3.0",
    
    # Web & HTTP
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    
    # WebSocket Server
    "websockets>=12.0",
    
    # Google APIs for Gmail & Cloud Backup
    "google-api-python-client>=2.108.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.0",
    
    # ============================================
    # VISION ENGINE (Local MiniCPM‑V)
    # ============================================
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.35.0",
    "accelerate>=0.25.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
playwright = [
    "playwright>=1.40.0",
]
cloud = [
    "google-cloud-storage>=2.14.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "tools", "memory", "personality"]

[tool.black]
line-length = 120
target-version = ['py310']           # Match the Python version

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

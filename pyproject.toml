[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruby"
version = "0.1.0"
description = "Ruby - Offline human-like assistant with local LLM brain and Pinecone vector memory"
readme = "README.md"
authors = [{name = "Ruby", email = "ruby@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "flet>=0.25.0",
    "llama-cpp-python>=0.2.80",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "websockets>=12.0",
    "pillow>=10.0.0",
    "pinecone-client>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
cloud = [
    "google-cloud-storage>=2.14.0",  # optional cloud backup
]

[tool.setuptools.packages.find]
include = ["engine*", "tools*", "personality*", "memory*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Install Linux Desktop Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev mesa-utils

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flet

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        cache: true

    - name: Accept Android Licenses
      run: yes | flutter doctor --android-licenses || true

    - name: Build APK
      env:
        # Cloudflare credentials (if you want to set them via secrets)
        CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Other secrets (optional)
        GMAIL_CREDENTIANLS_JSON: ${{ secrets.GMAIL_CREDENTIANLS_JSON }}
        GCLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_JSON }}
        FLET_SUPPRESS_PROMPTS: "true"
      run: |
        # ---- Write Gmail/Cloud credentials (optional) ----
        if [ -n "$GMAIL_CREDENTIANLS_JSON" ]; then
          echo "$GMAIL_CREDENTIANLS_JSON" > credentials.json
          echo "✅ Gmail credentials written."
        fi
        if [ -n "$GCLOUD_SERVICE_ACCOUNT_JSON" ]; then
          echo "$GCLOUD_SERVICE_ACCOUNT_JSON" > service_account.json
          echo "✅ Cloud Storage service account written."
        fi

        # ---- Clean and build ----
        rm -rf build/ dist/ __pycache__/
        flet build apk --python-version 3.14 --arch arm64-v8a --yes --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ruby-apk
        path: |
          build/**/*.apk
          **/app-*.apk

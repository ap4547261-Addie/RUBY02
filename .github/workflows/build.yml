name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      run: |
        echo "=== Freeing up disk space ==="
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Install Linux Desktop Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev mesa-utils

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies (including PyTorch)
      run: |
        python -m pip install --upgrade pip
        # Install PyTorch CPU version for the host (x86_64)
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install torchvision --index-url https://download.pytorch.org/whl/cpu
        # Install the rest from requirements.txt or pyproject.toml
        if [ -f pyproject.toml ]; then
          pip install .
        else
          pip install -r requirements.txt
        fi
        pip install flet-cli

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        cache: true

    - name: Accept Android Licenses
      run: yes | flutter doctor --android-licenses || true

    - name: Generate Config and Build APK
      env:
        GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
        GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
        GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
        GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
        GEMINI_API_KEY5: ${{ secrets.GEMINI_API_KEY5 }}
        GEMINI_API_KEY6: ${{ secrets.GEMINI_API_KEY6 }}
        GEMINI_API_KEY7: ${{ secrets.GEMINI_API_KEY7 }}
        GEMINI_API_KEY8: ${{ secrets.GEMINI_API_KEY8 }}
        GEMINI_API_KEY9: ${{ secrets.GEMINI_API_KEY9 }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
        GMAIL_CREDENTIANLS_JSON: ${{ secrets.GMAIL_CREDENTIANLS_JSON }}
        GCLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_JSON }}
        FLET_SUPPRESS_PROMPTS: "true"
      run: |
        # ---- Create config.py ----
        cat > config.py << 'EOF'
        GEMINI_API_KEY1 = "$GEMINI_API_KEY1"
        GEMINI_API_KEY2 = "$GEMINI_API_KEY2"
        GEMINI_API_KEY3 = "$GEMINI_API_KEY3"
        GEMINI_API_KEY4 = "$GEMINI_API_KEY4"
        GEMINI_API_KEY5 = "$GEMINI_API_KEY5"
        GEMINI_API_KEY6 = "$GEMINI_API_KEY6"
        GEMINI_API_KEY7 = "$GEMINI_API_KEY7"
        GEMINI_API_KEY8 = "$GEMINI_API_KEY8"
        GEMINI_API_KEY9 = "$GEMINI_API_KEY9"
        GEMINI_API_KEY   = "$GEMINI_API_KEY"
        PINECONE_API_KEY = "$PINECONE_API_KEY"
        PINECONE_INDEX_HOST = "$PINECONE_INDEX_HOST"
        EOF

        # ---- Create Gmail credentials ----
        if [ -n "$GMAIL_CREDENTIANLS_JSON" ]; then
          echo "$GMAIL_CREDENTIANLS_JSON" > credentials.json
          echo "✅ credentials.json created."
        else
          echo "⚠️ GMAIL_CREDENTIANLS_JSON not set – Gmail backup disabled."
        fi

        # ---- Create Cloud Storage service account ----
        if [ -n "$GCLOUD_SERVICE_ACCOUNT_JSON" ]; then
          echo "$GCLOUD_SERVICE_ACCOUNT_JSON" > service_account.json
          echo "✅ service_account.json created."
        else
          echo "ℹ️ GCLOUD_SERVICE_ACCOUNT_JSON not set – Cloud Storage disabled."
        fi

        # ---- Clean previous builds ----
        rm -rf build/ dist/ __pycache__/

        # ---- Test PyTorch import (to confirm installation) ----
        python -c "import torch; print('PyTorch version:', torch.__version__)" || exit 1

        # ---- Build APK ----
        flet build apk --python-version 3.10 --arch arm64-v8a --yes --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ruby-apk
        path: |
          build/**/*.apk
          **/app-*.apk

name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      run: |
        echo "=== Freeing up disk space ==="
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Install Linux Desktop Dependencies (Fixes Doctor Check)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev mesa-utils

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flet-cli

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        cache: true

    - name: Accept Android Licenses
      run: |
        yes | flutter doctor --android-licenses || true
    
    - name: Generate Config and Build APK
      env:
        # Chat Keys (1-4) - For complex questions
        GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
        GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
        GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
        GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
        # Image Keys (5-9) - For image generation
        GEMINI_API_KEY5: ${{ secrets.GEMINI_API_KEY5 }}
        GEMINI_API_KEY6: ${{ secrets.GEMINI_API_KEY6 }}
        GEMINI_API_KEY7: ${{ secrets.GEMINI_API_KEY7 }}
        GEMINI_API_KEY8: ${{ secrets.GEMINI_API_KEY8 }}
        GEMINI_API_KEY9: ${{ secrets.GEMINI_API_KEY9 }}
        # Fallback (keep for compatibility)
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Pinecone
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
        FLET_SUPPRESS_PROMPTS: "true"
      run: |
        # Create config.py with all 9 keys
        cat > config.py << 'EOF'
        # Gemini API Keys (1-4 for chat, 5-9 for images)
        GEMINI_API_KEY1 = "$GEMINI_API_KEY1"
        GEMINI_API_KEY2 = "$GEMINI_API_KEY2"
        GEMINI_API_KEY3 = "$GEMINI_API_KEY3"
        GEMINI_API_KEY4 = "$GEMINI_API_KEY4"
        GEMINI_API_KEY5 = "$GEMINI_API_KEY5"
        GEMINI_API_KEY6 = "$GEMINI_API_KEY6"
        GEMINI_API_KEY7 = "$GEMINI_API_KEY7"
        GEMINI_API_KEY8 = "$GEMINI_API_KEY8"
        GEMINI_API_KEY9 = "$GEMINI_API_KEY9"
        GEMINI_API_KEY = "$GEMINI_API_KEY"
        PINECONE_API_KEY = "$PINECONE_API_KEY"
        PINECONE_INDEX_HOST = "$PINECONE_INDEX_HOST"
        EOF
  
        # Clean build directory
        rm -rf build/ dist/ .venv/ venv/ __pycache__/
        rm -f RUBY_03.png
        
        # Verify config was created
        cat config.py
        
        # Compile Python files
        python3 -m compileall . || exit 1
        
        # Build APK with environment variables
        flet build apk --python-version 3.12 --arch arm64-v8a --yes
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ruby-apk
        path: |
          build/**/*.apk
          **/app-*.apk

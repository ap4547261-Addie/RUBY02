name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Free up disk space (important for large models)
    - name: Free Up Disk Space
      run: |
        echo "=== Freeing up disk space ==="
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    # 3. Install Linux desktop dependencies (required by Flet Doctor)
    - name: Install Linux Desktop Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev mesa-utils

    # 4. Set up Python 3.10 (compatible with PyTorch Android wheels)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 5. Install all Python dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install PyTorch from the CPU index (host is x86_64)
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install torchvision --index-url https://download.pytorch.org/whl/cpu
        # Install the rest from requirements.txt (fallback to pyproject.toml if missing)
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        elif [ -f pyproject.toml ]; then
          pip install .
        else
          echo "No requirements.txt or pyproject.toml found!" && exit 1
        fi
        pip install flet-cli

    # 6. Set up Flutter (required by Flet for Android build)
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        cache: true

    # 7. Accept Android licenses
    - name: Accept Android Licenses
      run: yes | flutter doctor --android-licenses || true

    # 8. Generate config files from secrets and build APK
    - name: Generate Config and Build APK
      env:
        # Gemini API Keys
        GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
        GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
        GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
        GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
        GEMINI_API_KEY5: ${{ secrets.GEMINI_API_KEY5 }}
        GEMINI_API_KEY6: ${{ secrets.GEMINI_API_KEY6 }}
        GEMINI_API_KEY7: ${{ secrets.GEMINI_API_KEY7 }}
        GEMINI_API_KEY8: ${{ secrets.GEMINI_API_KEY8 }}
        GEMINI_API_KEY9: ${{ secrets.GEMINI_API_KEY9 }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Pinecone (optional)
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
        # Backup credentials
        GMAIL_CREDENTIANLS_JSON: ${{ secrets.GMAIL_CREDENTIANLS_JSON }}
        GCLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_JSON }}
        FLET_SUPPRESS_PROMPTS: "true"
      run: |
        # ---- Create config.py ----
        cat > config.py << 'EOF'
        GEMINI_API_KEY1 = "${{ env.GEMINI_API_KEY1 }}"
        GEMINI_API_KEY2 = "${{ env.GEMINI_API_KEY2 }}"
        GEMINI_API_KEY3 = "${{ env.GEMINI_API_KEY3 }}"
        GEMINI_API_KEY4 = "${{ env.GEMINI_API_KEY4 }}"
        GEMINI_API_KEY5 = "${{ env.GEMINI_API_KEY5 }}"
        GEMINI_API_KEY6 = "${{ env.GEMINI_API_KEY6 }}"
        GEMINI_API_KEY7 = "${{ env.GEMINI_API_KEY7 }}"
        GEMINI_API_KEY8 = "${{ env.GEMINI_API_KEY8 }}"
        GEMINI_API_KEY9 = "${{ env.GEMINI_API_KEY9 }}"
        GEMINI_API_KEY   = "${{ env.GEMINI_API_KEY }}"
        PINECONE_API_KEY = "${{ env.PINECONE_API_KEY }}"
        PINECONE_INDEX_HOST = "${{ env.PINECONE_INDEX_HOST }}"
        EOF

        # ---- Create Gmail credentials ----
        if [ -n "$GMAIL_CREDENTIANLS_JSON" ]; then
          echo "$GMAIL_CREDENTIANLS_JSON" > credentials.json
          echo "✅ credentials.json created."
        else
          echo "⚠️ GMAIL_CREDENTIANLS_JSON not set – Gmail backup disabled."
        fi

        # ---- Create Cloud Storage service account ----
        if [ -n "$GCLOUD_SERVICE_ACCOUNT_JSON" ]; then
          echo "$GCLOUD_SERVICE_ACCOUNT_JSON" > service_account.json
          echo "✅ service_account.json created."
        else
          echo "ℹ️ GCLOUD_SERVICE_ACCOUNT_JSON not set – Cloud Storage disabled."
        fi

        # ---- Clean previous builds ----
        rm -rf build/ dist/ __pycache__/

        # ---- Test PyTorch import (to confirm installation) ----
        python -c "import torch; print('PyTorch version:', torch.__version__)" || exit 1

        # ---- Build APK with verbose output ----
        flet build apk \
          --python-version 3.10 \
          --arch arm64-v8a \
          --yes \
          --verbose

    # 9. Upload the APK as an artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ruby-apk
        path: |
          build/**/*.apk
          **/app-*.apk

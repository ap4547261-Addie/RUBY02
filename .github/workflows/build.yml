name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Install Linux Desktop Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev mesa-utils

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install host dependencies
      run: |
        python -m pip install --upgrade pip
        # Install PyTorch CPU wheels from the official PyTorch index (pin versions to known-good)
        python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.0.1" "torchvision==0.15.0"
        # Install other requirements (do not reinstall torch here if it's already installed)
        python -m pip install -r requirements.txt --no-deps || true
        python -m pip install flet-cli

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        cache: true

    - name: Accept Android Licenses
      run: yes | flutter doctor --android-licenses || true

    - name: Debug Python environment (temporary)
      run: |
        echo "=== python / pip info ==="
        python --version
        pip --version
        pip debug --verbose || true
        python -c "import platform, sys; print('machine:', platform.machine(), 'pyver:', sys.version)"

    - name: Build APK
      env:
        GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
        GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
        GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
        GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
        GEMINI_API_KEY5: ${{ secrets.GEMINI_API_KEY5 }}
        GEMINI_API_KEY6: ${{ secrets.GEMINI_API_KEY6 }}
        GEMINI_API_KEY7: ${{ secrets.GEMINI_API_KEY7 }}
        GEMINI_API_KEY8: ${{ secrets.GEMINI_API_KEY8 }}
        GEMINI_API_KEY9: ${{ secrets.GEMINI_API_KEY9 }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
        GMAIL_CREDENTIANLS_JSON: ${{ secrets.GMAIL_CREDENTIANLS_JSON }}
        GCLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_JSON }}
        FLET_SUPPRESS_PROMPTS: "true"
        # Keep PyTorch's wheel index available to pip inside the Flet build environment
        PIP_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"
      run: |
        cat > config.py << EOF
        GEMINI_API_KEY1 = "$GEMINI_API_KEY1"
        GEMINI_API_KEY2 = "$GEMINI_API_KEY2"
        GEMINI_API_KEY3 = "$GEMINI_API_KEY3"
        GEMINI_API_KEY4 = "$GEMINI_API_KEY4"
        GEMINI_API_KEY5 = "$GEMINI_API_KEY5"
        GEMINI_API_KEY6 = "$GEMINI_API_KEY6"
        GEMINI_API_KEY7 = "$GEMINI_API_KEY7"
        GEMINI_API_KEY8 = "$GEMINI_API_KEY8"
        GEMINI_API_KEY9 = "$GEMINI_API_KEY9"
        GEMINI_API_KEY   = "$GEMINI_API_KEY"
        PINECONE_API_KEY = "$PINECONE_API_KEY"
        PINECONE_INDEX_HOST = "$PINECONE_INDEX_HOST"
        EOF

        if [ -n "$GMAIL_CREDENTIANLS_JSON" ]; then
          echo "$GMAIL_CREDENTIANLS_JSON" > credentials.json
        fi
        if [ -n "$GCLOUD_SERVICE_ACCOUNT_JSON" ]; then
          echo "$GCLOUD_SERVICE_ACCOUNT_JSON" > service_account.json
        fi

        rm -rf build/ dist/ __pycache__/
        # Use Python 3.11 for Flet's embedded build environment as well
        flet build apk --python-version 3.11 --arch arm64-v8a --yes --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ruby-apk
        path: |
          build/**/*.apk
          **/app-*.apk
